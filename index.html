<title>Mateo · Gestor Académico — Ing. en Sistemas UTN</title>
<!-- ============================================================
     App Universitaria — Mateo
     Ingeniería en Sistemas de Información (UTN · Regional La Plata · Plan 2023 · Ord. 1877)
     Un solo archivo, sin dependencias. Funciona sin internet. Datos en localStorage.
     ============================================================ -->
<style>
/* ===================== TOKENS ===================== */
:root{
  --brand:#3366ff;--brand-soft:rgba(51,102,255,.12);
  --ok:#10b981;--ok-soft:rgba(16,185,129,.14);
  --warn:#f59e0b;--warn-soft:rgba(245,158,11,.16);
  --sky:#0ea5e9;--sky-soft:rgba(14,165,233,.14);
  --teal:#14b8a6;--teal-soft:rgba(20,184,166,.16);
  --red:#ef4444;--red-soft:rgba(239,68,68,.14);
  --purple:#8b5cf6;--purple-soft:rgba(139,92,246,.16);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
html[data-theme="light"]{--bg:#f6f8fc;--surface:#fff;--surface-2:#f8fafc;--border:#e6eaf1;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--input:#fff}
html[data-theme="dark"]{--bg:#0a0f1c;--surface:#0f1729;--surface-2:#131c30;--border:#1e293b;--text:#e8edf6;--muted:#94a3b8;--faint:#64748b;--input:#0b1220}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
h3{margin:0}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(120,130,150,.35);border-radius:8px}

/* ===================== LAYOUT ===================== */
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1560px;margin:0 auto;padding:0 26px}
@media(max-width:640px){.wrap{padding:0 14px}}
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--surface) 82%,transparent);border-bottom:1px solid var(--border)}
.top-inner{height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.brand strong{font-size:15px}
.icons{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border:0;background:transparent;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.body{flex:1;display:flex;flex-direction:column;padding:20px 0}
main{width:100%;min-width:0;display:flex;flex-direction:column;gap:18px}
nav.tabs{position:sticky;top:62px;z-index:15;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--surface) 82%,transparent);border-bottom:1px solid var(--border)}
nav.tabs ul{list-style:none;margin:0;padding:8px 0;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{display:flex;align-items:center;gap:8px;padding:8px 15px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button.active{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
nav.tabs .soon{font-size:9px;text-transform:uppercase;font-weight:700;opacity:.55;letter-spacing:.04em}
nav.tabs svg{width:17px;height:17px}

/* ===================== CARDS / STATS ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px 16px}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.progress{padding:16px}
.progress .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:9px}
.progress .row .muted{color:var(--faint)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s ease}
.bar.ok>i{background:var(--ok)}
.progress .cap{font-size:11.5px;color:var(--faint);margin-top:7px}

/* ===================== FILTROS ===================== */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ===================== NIVEL / MATERIA ===================== */
.nivel{overflow:hidden}
.nivel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.nivel-h .badge{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.nivel-h .t{font-weight:700;line-height:1.1}
.nivel-h .sub{font-size:12px;color:var(--faint)}
.nivel-h .mini{width:104px}
.rows{padding:6px}
.mitem+.mitem{border-top:1px solid var(--surface-2)}
.mrow{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:10px;border-radius:11px;cursor:pointer}
.mrow:hover{background:var(--surface-2)}
.mname{display:flex;align-items:center;gap:8px;min-width:0}
.mname .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dot{width:9px;height:9px;border-radius:99px;flex-shrink:0}
.tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:5px;flex-shrink:0}
.tag.int{background:var(--brand-soft);color:var(--brand)}
.tag.ele{background:var(--purple-soft);color:var(--purple)}
.badge-est{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;text-align:center;white-space:nowrap}
.openbtn{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--faint);display:grid;place-items:center}
.openbtn svg{transition:transform .2s}
.openbtn.rot svg{transform:rotate(90deg)}
.mrow:hover .openbtn{color:var(--text)}
/* resumen desplegable */
.resumen{padding:4px 12px 14px 30px;display:flex;flex-direction:column;gap:8px}
.rdiv{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-top:4px}
.rline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.rline .pn{color:var(--muted);min-width:78px}
.rnota{font-weight:700}
.mini-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}

/* estado colors */
.e-pendiente{background:var(--surface-2);color:var(--muted)}.d-pendiente{background:var(--faint)}

/* ============ CÁLCULO DE ESTADO ============ */
/* pinfo: info de un parcial. ef=mejor nota (para aprobar). promNota=nota que
   cuenta para promocionar (si el recuperatorio NO promociona, solo vale la nota
   original del parcial). key/lbl = estado del parcial. */
function pinfo(store,p,cfg){
  const uP=Number(cfg.uProm)||6,uA=Number(cfg.uAprob)||4;
  const r=store[p.n]||{};
  const orig=(r.nota===''||r.nota==null||isNaN(Number(r.nota)))?null:Number(r.nota);
  const recus=(r.recu||[]).map(Number).filter(x=>!isNaN(x)&&x>0);
  const all=[...(orig!=null?[orig]:[]),...recus];
  const ef=all.length?Math.max(...all):null;
  const promNota=cfg.recuPromociona?(ef==null?0:ef):(orig!=null?orig:0);
  let key='pendiente',lbl='Pendiente';
  if(ef!=null){ if(ef<uA){key='desaprobada';lbl='Desaprobado';} else if(promNota>=uP){key='promocionada';lbl='Promocionado';} else {key='regular';lbl='Aprobado';} }
  return {ef,promNota,loaded:all.length>0,key,lbl};
}
function outcomeDiv(cfg,parciales,store){
  if(!parciales||!parciales.length) return 'nc';
  const uP=Number(cfg.uProm)||6,uA=Number(cfg.uAprob)||4;
  const arr=parciales.map(p=>pinfo(store,p,cfg));
  const loaded=arr.filter(x=>x.loaded);
  if(loaded.length===0) return 'sin';
  if(loaded.length<arr.length) return 'cursando';
  if(arr.some(x=>x.ef<uA)) return 'desaprobada';
  const promoc = cfg.promedian ? (arr.reduce((a,b)=>a+b.promNota,0)/arr.length)>=uP : arr.every(x=>x.promNota>=uP);
  return promoc?'promocionada':'regular';
}
function derivar(id){
  const d=S.estados[id]; if(!d||!d.cfg) return (d&&d.estadoManual)||'pendiente';
  const cfg=d.cfg,seg=d.seg||{};
  const outs=divs(d).map(x=>outcomeDiv(cfg,x.parciales,x.store)).filter(o=>o!=='nc');
  if(!outs.length||outs.every(o=>o==='sin')) return d.estadoManual||'pendiente';
  if(outs.includes('desaprobada')) return 'desaprobada';
  if(outs.includes('cursando')||outs.includes('sin')) return 'cursando';
  let out=outs.every(o=>o==='promocionada')?'promocionada':'regular';
  const labsN=Number(cfg.labs)||0;
  const labsOk=(labsN===0)||(cfg.labsOblig===false)||((seg.labs||[]).filter(Boolean).length>=labsN);
  if(!labsOk) out='cursando';
  if(out==='regular'){const nf=Number(seg.finalNota);if(!isNaN(nf)&&nf>=(Number(cfg.uAprob)||4))out='finalok';}
  return out;
}
const estadoDe=id=>{const d=est(id);return d.cfg?derivar(id):'pendiente';};
const tieneParciales=d=>d.cfg&&divs(d).some(x=>x.parciales&&x.parciales.length);

function cloudPayload(){return {app:'mateo-academico',v:9,ts:Date.now(),estados:S.estados,bloques:S.bloques,cats:S.cats,estudio:S.estudio,eventos:S.eventos,evtipos:S.evtipos,apuntes:S.apuntes};}
function applyCloud(j){if(j.estados)S.estados=j.estados;if(j.bloques)S.bloques=j.bloques;if(j.cats&&j.cats.length)S.cats=j.cats;if(j.estudio)S.estudio=j.estudio;if(j.eventos)S.eventos=j.eventos;if(j.evtipos&&j.evtipos.length)S.evtipos=j.evtipos;if(j.apuntes)S.apuntes=j.apuntes;persist();}
function ensureGIS(cb){
  if(window.google&&google.accounts&&google.accounts.oauth2)return cb&&cb();
  if(window.__gisCb){window.__gisCb.push(cb);return;}
  window.__gisCb=[cb];
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;
  s.onload=()=>{const q=window.__gisCb||[];window.__gisCb=null;q.forEach(f=>f&&f());};
  s.onerror=()=>{window.__gisCb=null;alert('No se pudo cargar Google. Necesitás estar online y con la app publicada.');};
  document.head.appendChild(s);
}
async function gfetch(url,opts){
  opts=opts||{};opts.headers=Object.assign({Authorization:'Bearer '+S.google.token},opts.headers||{});
  const r=await fetch(url,opts);
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(r.status+' '+t.slice(0,140));}
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();
}
function gConnect(){
  if(!S.googleClientId){alert('Primero pegá el Client ID de Google.');return;}
  ensureGIS(()=>{
    try{
      const tc=google.accounts.oauth2.initTokenClient({
        client_id:S.googleClientId,
        scope:'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/calendar.events openid email profile',
        callback:async(resp)=>{
          if(resp&&resp.access_token){
            S.google.token=resp.access_token;S.google.connected=true;
            try{const u=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}}).then(r=>r.json());S.google.email=u.email||'';}catch(e){}
            render();
          }else{alert('No se recibió autorización.');}
        }
      });
      tc.requestAccessToken();
    }catch(e){alert('No se pudo iniciar la conexión: '+(e.message||e));}
  });
}
function gDisconnect(){try{if(S.google.token&&window.google)google.accounts.oauth2.revoke(S.google.token,()=>{});}catch(e){}S.google={connected:false,token:'',email:''};render();}
async function gSaveDrive(){
  if(!S.google.connected){alert('Conectate primero.');return;}
  try{
    let id=S.googleFileId;
    if(!id){const q=encodeURIComponent("name='mateo-data.json'");const l=await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);if(l.files&&l.files.length)id=l.files[0].id;}
    if(!id){const meta=await gfetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'mateo-data.json',parents:['appDataFolder']})});id=meta.id;}
    await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(cloudPayload())});
    S.googleFileId=id;S.googleSync=Date.now();persist();render();alert('Progreso guardado en tu Drive.');
  }catch(e){alert('Error al guardar en Drive: '+(e.message||e));}
}
async function gLoadDrive(){
  if(!S.google.connected){alert('Conectate primero.');return;}
  try{
    let id=S.googleFileId;
    if(!id){const q=encodeURIComponent("name='mateo-data.json'");const l=await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);if(l.files&&l.files.length)id=l.files[0].id;}
    if(!id){alert('Todavía no hay datos guardados en tu Drive.');return;}
    if(!confirm('Esto reemplaza los datos de ESTE dispositivo con los de tu Drive. ¿Continuar?'))return;
    const data=await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    applyCloud(typeof data==='string'?JSON.parse(data):data);
    S.googleFileId=id;persist();render();alert('Datos traídos de tu Drive.');
  }catch(e){alert('Error al traer de Drive: '+(e.message||e));}
}
function localDT(dateStr,timeStr,addMin){const d=new Date(dateStr+'T'+timeStr+':00');if(addMin)d.setMinutes(d.getMinutes()+addMin);const q=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${q(d.getMonth()+1)}-${q(d.getDate())}T${q(d.getHours())}:${q(d.getMinutes())}:00`;}
async function gPushCalendar(){
  if(!S.google.connected){alert('Conectate primero.');return;}
  const TZ='America/Argentina/Buenos_Aires';let ok=0,fail=0;
  for(const ev of (S.eventos||[])){
    const body={summary:ev.titulo,description:'Cargado desde el Gestor Académico'};
    if(ev.hora){body.start={dateTime:localDT(ev.fecha,ev.hora,0),timeZone:TZ};body.end={dateTime:localDT(ev.fecha,ev.hora,60),timeZone:TZ};}
    else{const n=new Date(ev.fecha+'T00:00:00');n.setDate(n.getDate()+1);const q=x=>String(x).padStart(2,'0');const nd=`${n.getFullYear()}-${q(n.getMonth()+1)}-${q(n.getDate())}`;body.start={date:ev.fecha};body.end={date:nd};}
    try{
      if(ev.gcalId){await gfetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.gcalId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
      else{const r=await gfetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});ev.gcalId=r.id;}
      ok++;
    }catch(e){fail++;}
  }
  persist();alert(`Eventos enviados a tu Google Calendar: ${ok} ok${fail?' · '+fail+' con error':''}.`);
}

function renderMathSpan(mm){
  if(window.katex){try{return window.katex.renderToString(mm.x,{displayMode:mm.d,throwOnError:false});}catch(e){}}

}
function mdRender(src){
  if(!src||!src.trim())return '<p class="apu-empty">La vista previa aparece acá…</p>';
  const math=[];
  src=src.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>{math.push({d:true,x:x.trim()});return `@@M${math.length-1}@@`;});
  src=src.replace(/\$([^$\n]+?)\$/g,(m,x)=>{math.push({d:false,x:x.trim()});return `@@M${math.length-1}@@`;});
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code class="md-code">$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const L=src.split('\n');const out=[];let i=0;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++;}i++;out.push(`<pre class="md-pre">${esc(buf.join('\n'))}</pre>`);continue;}
    if(/^### /.test(l)){out.push(`<h3>${inl(l.slice(4))}</h3>`);i++;continue;}
    if(/^## /.test(l)){out.push(`<h2>${inl(l.slice(3))}</h2>`);i++;continue;}
    if(/^# /.test(l)){out.push(`<h1>${inl(l.slice(2))}</h1>`);i++;continue;}
    if(/^\s*[-*] /.test(l)){const it=[];while(i<L.length&&/^\s*[-*] /.test(L[i])){it.push(`<li>${inl(L[i].replace(/^\s*[-*] /,''))}</li>`);i++;}out.push(`<ul>${it.join('')}</ul>`);continue;}
    if(/^\s*\d+\. /.test(l)){const it=[];while(i<L.length&&/^\s*\d+\. /.test(L[i])){it.push(`<li>${inl(L[i].replace(/^\s*\d+\.\s/,''))}</li>`);i++;}out.push(`<ol>${it.join('')}</ol>`);continue;}
    if(l.trim()===''){i++;continue;}
    const buf=[l];i++;while(i<L.length&&L[i].trim()!==''&&!/^(#{1,3} |```|\s*[-*] |\s*\d+\. )/.test(L[i])){buf.push(L[i]);i++;}
    out.push(`<p>${buf.map(inl).join('<br>')}</p>`);
  }
  return out.join('').replace(/@@M(\d+)@@/g,(m,idx)=>renderMathSpan(math[idx]));
}

/* ---------- SIMULADOR DE NOTAS ---------- */
function simulaObjetivo(d,target){
  const cfg=d.cfg;const goal=target==='prom'?(+cfg.uProm||6):(+cfg.uAprob||4);
  return divs(d).filter(x=>x.parciales.length).map(x=>{
    const n=x.parciales.length;
    const infos=x.parciales.map(p=>({p,i:pinfo(x.store,p,cfg)}));
    const loaded=infos.filter(o=>o.i.loaded);const pend=infos.filter(o=>!o.i.loaded);
    const nm=o=>esc(o.p.nombre);const uA=+cfg.uAprob||4;
    if(cfg.promedian){
      const sumEf=loaded.reduce((a,o)=>a+o.i.ef,0);
      const failed=loaded.filter(o=>o.i.ef<uA);
      if(failed.length) return {div:x.label,ok:false,txt:`primero tenés que recuperar ${failed.map(nm).join(', ')} (bajó de ${uA}).`};
      if(!pend.length){const avg=sumEf/n;return {div:x.label,ok:avg>=goal,txt:avg>=goal?`ya alcanzado (promedio ${avg.toFixed(1)}).`:`no alcanzado: promedio ${avg.toFixed(1)}, hacía falta ${goal}.`};}
      const per=(goal*n-sumEf)/pend.length;
      if(per>10) return {div:x.label,ok:false,txt:`no es alcanzable: necesitarías más de 10 de promedio en lo que falta.`};
      const val=per<=uA?`${uA}`:per.toFixed(1);
      return {div:x.label,ok:true,txt:`promediá ≥ ${val} en ${pend.map(nm).join(', ')}${per<=0?' (ya está prácticamente asegurado)':''}.`};
    }
    const blockers=loaded.filter(o=>target==='prom'?o.i.promNota<goal:o.i.ef<goal);
    if(blockers.length) return {div:x.label,ok:false,txt:`falta levantar ${blockers.map(nm).join(', ')} a ≥ ${goal} (recuperatorio).`};
    if(!pend.length) return {div:x.label,ok:true,txt:`ya cumplido con lo cargado.`};
    return {div:x.label,ok:true,txt:`sacá ≥ ${goal} en ${pend.map(nm).join(', ')}.`};
  });
}

function lanesDia(bloques){
  const items=bloques.map(b=>({...b,mi:toMin(b.ini),mf:toMin(b.fin)})).sort((a,b)=>a.mi-b.mi||a.mf-b.mf);
  const laneEnd=[];
  items.forEach(it=>{let ok=false;for(let i=0;i<laneEnd.length;i++){if(laneEnd[i]<=it.mi){it.lane=i;laneEnd[i]=it.mf;ok=true;break;}}if(!ok){it.lane=laneEnd.length;laneEnd.push(it.mf);}});
  return {items,total:Math.max(1,laneEnd.length)};
}

function viewSemana(){
  const sH=6,eH=24,hH=46,startMin=sH*60,boardH=(eH-sH)*hH;
  const hours=[];for(let h=sH;h<eH;h++)hours.push(h);
  const gutter=`<div class="wk-gutter"><div class="wk-colh"></div><div style="height:${boardH}px;position:relative">
    ${hours.map((h,i)=>`<div class="wk-hr" style="top:${i*hH-6}px">${String(h).padStart(2,'0')}:00</div>`).join('')}</div></div>`;
  const cols=DIAS.map((d,di)=>{
    const {items,total}=lanesDia((S.bloques||[]).filter(b=>b.dia===di));
    const blocks=items.map(it=>{
      const top=(it.mi-startMin)/60*hH,height=Math.max(16,(it.mf-it.mi)/60*hH-2);
      const w=100/total,left=it.lane*w;const cat=catById(it.cat);
      const titulo=it.titulo||(it.materiaId?(PLAN.find(m=>m.id===it.materiaId)||{}).nombre:cat.label);
      return `<div class="blk" style="top:${top}px;height:${height}px;left:${left}%;width:calc(${w}% - 3px);background:${hexA(cat.color,0.16)};border-left:3px solid ${cat.color}" data-blk="${it.id}">
        <div class="blk-t">${esc(titulo)}</div><div class="blk-s">${fmtMin(it.mi)}–${fmtMin(it.mf)}</div></div>`;
    }).join('');
    return `<div class="wk-col"><div class="wk-colh">${DIAS_S[di]}</div>
      <div class="wk-day" style="height:${boardH}px" data-day="${di}">
        ${hours.map((h,i)=>`<div class="wk-line" style="top:${i*hH}px"></div>`).join('')}${blocks}</div></div>`;
  }).join('');
  return `<div class="dhead"><div style="flex:1;min-width:0"><div class="dtitle">Cronograma semanal</div>
      <div class="dsub">Organizá tu cursada y rutinas por bloques. Tocá un día vacío o el botón para agregar.</div></div>
    <button class="backbtn" id="catBtn">⚙️ Categorías</button>
    <button class="backbtn" id="addblk" style="background:var(--brand);color:#fff;border-color:var(--brand)">${icon('plus')} Agregar bloque</button></div>
    ${S.catEdit?catManager():''}

    <div class="card" style="padding:12px"><div class="wk-scroll"><div class="wk-grid">${gutter}${cols}</div></div></div>`;
}

/* ---------- ÁRBOL DE CORRELATIVIDADES ---------- */
function infoNodo(id){
  const m=PLAN.find(x=>x.id===id);const e=estadoDe(id);const req=reqEstado(id);
  const nm=x=>{const mm=PLAN.find(y=>y.id===x);return mm?mm.nombre:('#'+x);};
  let msg;
  if(SUPERADA.includes(e)) msg=`<span class="ok">✓ Ya la tenés ${e==='promocionada'?'promocionada':'aprobada'}.</span>`;
  else if(req.cursable) msg=`<span class="ok">🔓 Habilitada: cumplís las correlativas para cursarla.</span>`;
  else{
    const f1=req.faltanC.length?`regularizar ${req.faltanC.map(nm).join(', ')}`:'';
    const f2=req.faltanA.length?`aprobar ${req.faltanA.map(nm).join(', ')}`:'';
    msg=`<span class="lk">🔒 Te falta: ${[f1,f2].filter(Boolean).join(' · ')}.</span>`;
  }
  const extra=(CORR[id]&&CORR[id].todas)?`<div class="cn-extra">Además, para rendir el final hay que tener aprobadas todas las materias del plan.</div>`:'';
  return `<div class="corr-info"><strong>${m.nombre}</strong> — ${ESTADOS[e].label}.<br>${msg}${extra}</div>`;
}
function viewCorrelativas(){
  const colW=232,nodeW=200,nodeH=52,vGap=12,topPad=30,leftPad=6;
  const byN={};NIVELES.forEach(n=>byN[n]=PLAN.filter(m=>m.nivel===n));
  const pos={};
  NIVELES.forEach((n,ci)=>byN[n].forEach((m,ri)=>{pos[m.id]={x:leftPad+ci*colW,y:topPad+ri*(nodeH+vGap)};}));
  const maxRows=Math.max(...NIVELES.map(n=>byN[n].length));
  const W=leftPad+5*colW-(colW-nodeW)+6, H=topPad+maxRows*(nodeH+vGap);
  const sel=S.selNode;
  const pre=new Set(),unl=new Set();
  if(sel&&CORR[sel]){(CORR[sel].c||[]).forEach(x=>pre.add(x));(CORR[sel].a||[]).forEach(x=>pre.add(x));
    PLAN.forEach(m=>{const cc=CORR[m.id];if(cc&&([...(cc.c||[]),...(cc.a||[])].includes(sel)))unl.add(m.id);});}
  let heads='';NIVELES.forEach((n,ci)=>{heads+=`<div class="corr-col-h" style="left:${leftPad+ci*colW}px">${NIVEL_LABEL[n]}</div>`;});
  let lines='';
  PLAN.forEach(m=>{const cc=CORR[m.id];if(!cc||!pos[m.id])return;
    [...(cc.c||[]).map(x=>[x,'c']),...(cc.a||[]).map(x=>[x,'a'])].forEach(([pr,ty])=>{
      if(!pos[pr])return;
      const x1=pos[pr].x+nodeW,y1=pos[pr].y+nodeH/2,x2=pos[m.id].x,y2=pos[m.id].y+nodeH/2,mx=(x1+x2)/2;
      const active=sel&&(sel===m.id||sel===pr);
      const cls=(ty==='a'?'ln-a':'ln-c')+(active?' on':(sel?' dim':''));
      lines+=`<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });});
  let nodes='';
  PLAN.forEach(m=>{const p=pos[m.id];const e=estadoDe(m.id);const req=reqEstado(m.id);
    const st=SUPERADA.includes(e)?'done':(req.cursable?'avail':'lock');
    const dim=sel&&sel!==m.id&&!pre.has(m.id)&&!unl.has(m.id)?'dim':'';
    const ring=sel===m.id?'sel':(pre.has(m.id)?'pre':(unl.has(m.id)?'unl':''));
    nodes+=`<div class="cnode ${st} ${dim} ${ring}" style="left:${p.x}px;top:${p.y}px;width:${nodeW}px;height:${nodeH}px" data-node="${m.id}">
      <span class="cn-num">${m.electiva?'E':m.id}</span><span class="cn-name">${m.nombre}</span><span class="dot d-${e}"></span></div>`;
  });
  return `<div class="corr-legend">
    <span class="lg"><span class="sq" style="background:var(--ok-soft)"></span>Superada</span>
    <span class="lg"><span class="sq" style="background:var(--surface-2);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)"></span>Habilitada para cursar</span>
    <span class="lg"><span class="sq" style="background:var(--surface-2);opacity:.6"></span>Bloqueada</span>
    <span class="lg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--sky)" stroke-width="2.6"/></svg>Necesita Regularizada</span>
    <span class="lg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--ok)" stroke-width="2.6"/></svg>Necesita Aprobada</span>
  </div>
  ${sel?infoNodo(sel):`<div class="corr-info" style="color:var(--muted)">Tocá una materia para ver sus correlativas y qué desbloquea. El color y el candado se calculan con tu progreso real.</div>`}
  <div class="corr-scroll"><div class="corr-board" style="width:${W}px;height:${H}px">
    <svg class="corr-svg" width="${W}" height="${H}">${lines}</svg>${heads}${nodes}
  </div></div>`;
}

      if(k==='dividida'&&d.cfg.dividida){if(!d.cfg.divT.length)setNParciales(id,2,'t');if(!d.cfg.divP.length)setNParciales(id,2,'p');}persist();render();});
    document.querySelectorAll('[data-uni]').forEach(el=>el.onchange=()=>{const u=d.cfg.unidades.find(x=>x.n===+el.dataset.uni);if(u){u.titulo=el.value;persist();}});
    document.querySelectorAll('[data-dictada]').forEach(el=>el.onchange=()=>{const u=d.cfg.unidades.find(x=>x.n===+el.dataset.dictada);if(u){u.dictada=el.checked;persist();}});
    document.querySelectorAll('[data-deluni]').forEach(el=>el.onclick=()=>{const n=+el.dataset.deluni;d.cfg.unidades=d.cfg.unidades.filter(x=>x.n!==n).map((u,i)=>({...u,n:i+1}));[d.cfg.parciales,d.cfg.divT,d.cfg.divP].forEach(arr=>arr.forEach(p=>p.unidades=(p.unidades||[]).filter(x=>x<=d.cfg.unidades.length)));persist();render();});
    const adduni=document.getElementById('adduni');if(adduni)adduni.onclick=()=>{d.cfg.unidades.push({n:d.cfg.unidades.length+1,titulo:'',dictada:true});persist();render();};
    document.querySelectorAll('[data-pname]').forEach(el=>el.onchange=()=>{const[k,pn]=el.dataset.pname.split('|');const p=parcialesOf(d,k).find(x=>x.n===+pn);if(p){p.nombre=el.value;persist();}});
    document.querySelectorAll('[data-pu]').forEach(el=>el.onchange=()=>{const[k,pn]=el.dataset.pu.split('|');const uv=+el.value;const p=parcialesOf(d,k).find(x=>x.n===+pn);p.unidades=p.unidades||[];if(el.checked){if(!p.unidades.includes(uv))p.unidades.push(uv);}else{p.unidades=p.unidades.filter(x=>x!==uv);}persist();render();});
    document.querySelectorAll('[data-pnota]').forEach(el=>el.onchange=()=>{const[k,pn]=el.dataset.pnota.split('|');const st=storeOf(d,k);st[pn]={...(st[pn]||{}),nota:el.value};persist();render();});
    document.querySelectorAll('[data-recu]').forEach(el=>el.onchange=()=>{const[k,pn]=el.dataset.recu.split('|');const ri=+el.dataset.ri;const st=storeOf(d,k);const r=st[pn]||(st[pn]={});r.recu=r.recu||[];r.recu[ri]=el.value;persist();render();});
    document.querySelectorAll('[data-lab]').forEach(el=>el.onchange=()=>{const i=+el.dataset.lab;d.seg.labs=d.seg.labs||[];d.seg.labs[i]=el.checked;persist();render();});
    const fin=document.querySelector('[data-final]');if(fin)fin.onchange=()=>{d.seg.finalNota=fin.value;persist();render();};
  }
}
function keyHandler(e){
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  const typing=/INPUT|SELECT|TEXTAREA/.test(tag);
  if(e.key==='?'){S.showHelp=!S.showHelp;render();return;}
  if(e.key==='Escape'){if(S.showHelp)S.showHelp=false;else if(S.blkEdit||S.catEdit){S.blkEdit=null;S.catEdit=false;}else if(S.view!=null)S.view=null;else return;render();return;}
  if(typing)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=NAV.length){S.tab=NAV[n-1].k;S.view=null;S.selNode=null;S.blkEdit=null;S.catEdit=false;render();return;}
  if(e.key==='t'||e.key==='T'){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme);persist();render();return;}
  if(S.tab==='enfoque'){
    if(e.key===' '){e.preventDefault();pomoToggle();}
    else if(e.key==='n'||e.key==='N'){pomoSkip();}
    else if(e.key==='r'||e.key==='R'){pomoReset();}
  }
}
render();
if(!window.__pomoInt)window.__pomoInt=setInterval(pomoTick,1000);
if(!window.__keys){window.__keys=true;document.addEventListener('keydown',keyHandler);}
</script>
